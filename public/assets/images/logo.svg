            <rect x="0" y="8" width="22" height="32" rx="4" fill="#0F385A"/>
            <circle cx="11" cy="24" r="5" fill="#FFFFFF"/>
            <rect x="22" y="16" width="220" height="16" rx="8" fill="#FFFFFF" stroke="#0F385A" stroke-width="4"/>
            <path d="M 50,18 L 65,18 L 50,30 Z M 80,18 L 95,18 L 80,30 Z M 110,18 L 125,18 L 110,30 Z M 140,18 L 155,18 L 140,30 Z M 170,18 L 185,18 L 170,30 Z M 200,18 L 215,18 L 200,30 Z" fill="#00A8E8"/>
        </g>

        <!-- Valët Bazë -->
        <path d="M 120,380 C 180,340 260,370 310,385 C 360,400 420,380 440,350" fill="none" stroke="#00A8E8" stroke-width="20" stroke-linecap="round"/>
        <path d="M 150,405 C 200,375 270,395 320,410 C 370,420 400,410 420,390" fill="none" stroke="#0F385A" stroke-width="16" stroke-linecap="round"/>
    </g>

    <!-- Teksti V-PMS -->
    <text x="32" y="19" font-family="Arial, sans-serif" font-weight="900" font-size="17" fill="#0F385A" letter-spacing="1">V-PMS</text>
