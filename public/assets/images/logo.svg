            <circle cx="35" cy="20" r="18" fill="#00C4EE"/>
            <path d="M 35,-5 L 35,-1 M 12,0 L 15,3 M 58,0 L 55,3 M 5,20 L 9,20 M 65,20 L 61,20" stroke="#00C4EE" stroke-width="4" stroke-linecap="round"/>
            <path d="M 5,32 Q 20,26 35,32 T 65,32" fill="none" stroke="#0F385A" stroke-width="5" stroke-linecap="round"/>
            <path d="M 10,42 Q 25,36 40,42 T 60,42" fill="none" stroke="#0F385A" stroke-width="4.5" stroke-linecap="round"/>
        </g>

        <!-- Shkronja V -->
        <path d="M 180,180 L 255,360 L 390,120" fill="none" stroke="#0F385A" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>

